<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Trainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <div class="game-section">
            <div class="ui-panel">
                <h2>Score: <span id="score">0</span></h2>
                <h2>Time: <span id="timer">10.0</span>s</h2>
                <button id="start-btn">Start Game</button>
            </div>
            
            <p class="instructions">
                <strong>How to play:</strong> Click the red dot to score points and increase time. 
                Clicking one of the blue dots results in losing one point.
            </p>
            
            <div id="arena">
                <div id="target"></div>
                <div class="decoy"></div>
                <div class="decoy"></div>
                <div class="decoy"></div>
            </div>
        </div>

        <div class="leaderboard-section">
            <h2>Top Scores</h2>
            <ol id="leaderboardList">
                </ol>
            <button id="clear-btn">Clear Leaderboard</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
